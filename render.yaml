services:
  - type: web
    name: civictrack
    env: node
    plan: free
    buildCommand: npm install && npm --prefix server install && npm --prefix client install && npm --prefix client run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: MONGODB_URI
        sync: false
